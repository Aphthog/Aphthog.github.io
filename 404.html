
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Camille</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: -apple-system, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f1ea;
  color: #3a3028;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
.container { text-align: center; padding: 0 24px; }
.code {
  font-family: Georgia, 'Noto Serif SC', serif;
  font-size: 96px;
  color: #d4783e;
  line-height: 1;
  margin-bottom: 12px;
}
.msg {
  font-size: 18px;
  color: #9a8a78;
  margin-bottom: 32px;
}
.home-link {
  display: inline-block;
  padding: 10px 24px;
  background: #d4783e;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-size: 14px;
  transition: background 200ms ease;
}
.home-link:hover { background: #c4672e; }
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <div class="msg">页面不存在</div>
  <a href="/" class="home-link">回首页</a>
</div>
</body>
</html>
