# ========== NexT 主题配置 ==========

# 自定义文件注入
custom_file_path:
  variable: source/_data/variables.styl
  style: source/_data/styles.styl

# 风格: Muse（极简）/ Mist（紧凑）/ Pisces（双栏） / Gemini（扁平）
scheme: Gemini

# ---------- 暗色模式 ----------
darkmode: false

# ---------- 字体 ----------
font:
  enable: true
  global:
    external: false
    family: '-apple-system, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif'
    size: 15px
  title:
    external: false
    family: 'Georgia, Noto Serif SC, serif'
    size: 26px
  headings:
    external: false
    family: 'Georgia, Noto Serif SC, PingFang SC, sans-serif'
  posts:
    external: false
    family: '-apple-system, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif'
    size: 15px
  codes:
    external: false
    family: 'JetBrains Mono, Fira Code, Consolas, monospace'
    size: 13px

# ---------- 配色 ----------
theme_color:
  light: "#d4783e"
  dark: "#c4672e"

# ---------- 菜单 ----------
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags

# ---------- 侧边栏 ----------
sidebar:
  display: remove
  position: left
  offset: 12

# ---------- 文章设置 ----------
excerpt_description: true
auto_excerpt:
  enable: true
  length: 150

# 阅读进度条
reading_progress:
  enable: true
  position: top
  color: "#d4783e"
  height: 2px

# 文章元信息
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true

# ---------- 图片 ----------
mediumzoom: true
lazyload: true

# ---------- 返回顶部 ----------
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# ---------- 页脚 ----------
footer:
  since: 2026
  powered: false

# ---------- 代码块 ----------
codeblock:
  highlight_theme: "normal"
  copy_button:
    enable: true
    show_result: true
    style: flat

# ---------- 社交 ----------
social:
  GitHub: https://github.com/Aphthog || fab fa-github

social_icons:
  icons_only: false
  transition: true
